upstream app_prod {
    server app-prod:8000;
}

client_max_body_size 10M;

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name api.wellbee-studio.com;
    return 301 https://$host$request_uri;
}

# api.wellbee-studio.comに来たリクエストを、パスルーティングでapp-prodかapp-reviewコンテナに切り替え
server {
    listen 443 ssl;
    server_name api.wellbee-studio.com;

    ssl_certificate     /etc/letsencrypt/live/api.wellbee-studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wellbee-studio.com/privkey.pem;

    location /static/ {
        alias /static/;
    }

    # 審査用 v4 → app-review（コンテナ停止中は502、Nginx自体はクラッシュしない）
    location /api/v4/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_review app-review:8000;
        proxy_pass http://$upstream_review;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # 現行Userの使用はバージョンプレフィックスなし
    location / {
        proxy_pass http://app_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}